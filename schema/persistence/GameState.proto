syntax = "proto3";

import "persistence/InventoryState.proto";
import "persistence/PlayerLivesState.proto";
import "persistence/ShipState.proto";
import "persistence/CraftingState.proto";

message GameState
{
	int32 num_levels_played = 1;
	int32 xp = 2;
	InventoryState inventory = 3;
	int32 player_level = 4;
	PlayerLivesState player_lives = 5;
	repeated ShipState ships = 6;
	CraftingState crafting = 7;
}