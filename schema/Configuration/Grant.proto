syntax = "proto3";

import "Configuration/Requirement.proto";

message Grant
{
	GrantType type = 1;
	string id = 2;
	int32 amount = 3;
	repeated Requirement requirements = 4;
}

enum GrantType
{
	GrantType_Unset = 0;
	GrantType_Resource = 1;
	GrantType_Xp = 2;
	GrantType_MaxLivesIncrease = 3;
	GrantType_LootTable = 4;
}