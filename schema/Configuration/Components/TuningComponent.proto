syntax = "proto3";

//import "configuration/Utils.proto";
import "google/protobuf/duration.proto";

message TuningComponent
{
	repeated string world_ids = 1;
	repeated string inventory_resources = 2;
	string player_level_curve_id = 3;
	string xp_resource_id = 4;
	google.protobuf.Duration life_refill_duration = 5;
	repeated string initial_ships = 6;
	int32 perfect_score_xp_bonus = 7;
}