syntax = "proto3";

//import "configuration/Utils.proto";
import "configuration/Grant.proto";

message PlayerLevelCurveComponent
{
	map<string, PlayerLevelCurveLevel> levels = 1;
}

message PlayerLevelCurveLevel
{
	int32 min_xp = 1;
	repeated Grant rewards = 2;
	int32 level = 3; // for easy lookup
}